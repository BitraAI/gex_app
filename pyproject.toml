# Project metadata + dependency pins for `uv run` / `uv sync`.
# The app itself is run as `streamlit run app.py` from the repo root (run.sh);
# `scripts` and `schwab_mcp` are plain source packages, nothing is installed
# from them into site-packages.
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gex-app"
version = "1.0.0"
description = "GammaEx: Schwab-powered gamma exposure / options flow dashboard"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.58.0",
    "streamlit-lightweight-charts-v5>=0.1.8",
    "plotly>=6.8.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "schwab-py>=1.5.1",
    "mcp>=2.0.0",
    "uvicorn>=0.30.0",
    "tzdata",
    "feedparser>=6.0",
    "yfinance>=1.5.0",
    "scipy>=1.13.0",
]

[tool.setuptools]
# Nothing is installed from the source tree: the app is launched via
# `streamlit run app.py` from the repo root (see run.sh), and scripts/ +
# schwab_mcp/ are imported in-place via sys.path. The empty list prevents
# setuptools' auto-discovery from choking on the two top-level packages.
packages = []
py-modules = []
